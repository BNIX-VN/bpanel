name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest ruff bandit pip-audit semgrep

      # Each of these steps has its own pre-existing, unrelated debt (581 ruff
      # findings, 13 bandit medium/high findings, 18 known CVEs in pinned
      # deps) that predates this workflow fix and isn't something to silently
      # bulk-fix in passing. `if: always()` just stops one broken step from
      # hiding whether the others - especially Tests, which used to be
      # skipped entirely - pass or fail. The job's overall red/green still
      # reflects every step honestly; it no longer reports "skipped" for
      # things that never got a chance to run.
      - name: Lint (ruff)
        run: ruff check backend/app

      - name: Security scan (bandit)
        if: always()
        run: bandit -r backend/app -ll -q

      - name: Compile-only sanity check
        if: always()
        run: |
          python -c "import py_compile, glob; [py_compile.compile(f, doraise=True) for f in glob.glob('backend/app/**/*.py', recursive=True)]"

      - name: pip-audit
        if: always()
        run: pip-audit -r backend/requirements.txt --strict

      - name: Semgrep
        if: always()
        run: semgrep --config=auto backend/app

      - name: Tests
        if: always()
        run: pytest backend/app/tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build
        working-directory: frontend
        run: npm run build

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck on installer scripts
        uses: ludeeus/action-shellcheck@master
        with:
          ignore_paths: "node_modules"
        env:
          SHELLCHECK_OPTS: -e SC1091

  # GitHub-hosted ubuntu-24.04 runners are real VMs (systemd as PID 1, full
  # apt/root access) - not containers - so this runs the actual installer end
  # to end on a disposable box: nginx, MariaDB, PHP-FPM, Redis, the works.
  # It catches "the installer no longer completes" or "a fresh panel can't
  # provision a website" before either reaches a real customer VPS. It does
  # NOT replace manual VPS testing - no real domain/SSL, no OpenLiteSpeed
  # path, no long-lived load - so it only runs on pushes that land on main,
  # not on every PR.
  install-smoke-test:
    # Deliberately not `needs: backend` - the backend job's lint/security
    # steps carry pre-existing debt unrelated to whether the panel installs,
    # and this shouldn't wait on (or be blocked by) that.
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    env:
      BPANEL_ADMIN_PASSWORD: ${{ github.run_id }}-ci-smoke-Aa1!
    steps:
      - uses: actions/checkout@v4

      - name: Run installer/install.sh (nginx, no domain -> self-signed panel cert)
        env:
          PANEL_URL: http://127.0.0.1:2222
        run: sudo -E bash installer/install.sh

      - name: Health check
        run: |
          for _ in $(seq 1 30); do
            curl -kfsS --max-time 5 https://127.0.0.1:2222/api/health && exit 0
            sleep 1
          done
          sudo journalctl -u bpanel-api -n 200 --no-pager
          exit 1

      - name: Log in and create a test website
        run: |
          set -euo pipefail
          token="$(
            curl -ksf -X POST https://127.0.0.1:2222/api/auth/login \
              -H 'Content-Type: application/x-www-form-urlencoded' \
              --data-urlencode "username=admin" \
              --data-urlencode "password=${BPANEL_ADMIN_PASSWORD}" \
              | jq -r '.access_token'
          )"
          [ -n "$token" ] && [ "$token" != "null" ]

          curl -ksf -X POST https://127.0.0.1:2222/api/websites \
            -H "Authorization: Bearer ${token}" \
            -H 'Content-Type: application/json' \
            -d '{"domain":"smoke-test.example","install_wordpress":false,"app_type":"php"}' \
            | tee /tmp/website-create.json
          grep -q '"domain":"smoke-test.example"' /tmp/website-create.json

      - name: Verify the vhost was actually written and nginx is happy
        run: |
          sudo test -f /etc/nginx/conf.d/smoke-test.example.conf
          sudo nginx -t
          curl -ksf -H 'Host: smoke-test.example' https://127.0.0.1/ -o /dev/null

      - name: Dump service logs on failure
        if: failure()
        run: |
          sudo journalctl -u bpanel-api -n 300 --no-pager || true
          sudo nginx -t || true
          sudo tail -n 100 /var/log/nginx/error.log || true
