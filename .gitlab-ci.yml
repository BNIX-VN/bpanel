# BPanel CI on gitlab.sieunhim.com (moved from GitHub Actions, 2026-10-22).
#
# Same split as .github/workflows/ci.yml:
#   Blocking  - must be green, and can be green today.
#   Reporting - allow_failure: pre-existing debt (ruff, bandit, semgrep)
#               stays visible in the log without turning every run red.
#
# runner-01 is a Docker runner, so every job runs in a plain container. The
# install smoke test (install.sh on a whole Ubuntu with systemd, then a site
# end to end) is not ported yet: it needs a shell runner on a throwaway VM.
#
# A commit with [skip ci] in its message starts no pipeline.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"
    # Branches with an open MR run as the MR pipeline above, not twice.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages:
  - test
  - report

default:
  tags: [docker]
  interruptible: true

.python:
  image: python:3.12
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  cache:
    key: pip-$CI_COMMIT_REF_SLUG
    paths: [.cache/pip]
  before_script:
    - python -m pip install --upgrade pip
    - pip install -r backend/requirements.txt

backend:
  extends: .python
  stage: test
  timeout: 45m
  script:
    # Not for serving anything: nginx is the only thing that can say whether
    # a directive we emit is valid (fastcgi_cache_use_stale http_502 passed
    # every string assertion and still made nginx refuse the config). Without
    # it the cache tests skip silently.
    - apt-get update -qq && apt-get install -y -qq nginx >/dev/null
    # httpx2: starlette 1.x's TestClient needs it; tests only, not the panel.
    - pip install pytest httpx2
    - pytest backend/app/tests backend/tests -q
    - python -c "import py_compile, glob; [py_compile.compile(f, doraise=True) for f in glob.glob('backend/app/**/*.py', recursive=True)]"

pip-audit:
  extends: .python
  stage: test
  script:
    - pip install pip-audit
    # Ignoring exactly the advisories with no fixed version published;
    # anything else, a new advisory against these packages included, fails.
    #   PYSEC-2026-2858  paramiko     (no fixed version as of 2026-09-07)
    #   PYSEC-2026-1325  ecdsa        (no fixed version; transitive)
    #   CVE-2026-85394   python-jose  (no release as of 2026-10-06). BPanel
    #     signs and verifies HS256 with its own secret and every jwt.decode
    #     pins algorithms=[ALGORITHM]. The way out for good is PyJWT.
    - pip-audit -r backend/requirements.txt --strict
        --ignore-vuln PYSEC-2026-2858
        --ignore-vuln PYSEC-2026-1325
        --ignore-vuln CVE-2026-85394

frontend:
  stage: test
  image: node:22
  cache:
    key:
      files: [frontend/package-lock.json]
    paths: [frontend/node_modules]
  script:
    - cd frontend
    - npm ci
    - npm run build

shell:
  stage: test
  image: koalaman/shellcheck-alpine:stable
  script:
    - apk add --no-cache bash
    # Blocking: a script that does not parse is broken on every server.
    - find installer -name '*.sh' -print0 | xargs -0 -n1 bash -n
    - find installer -name '*.sh' -print0 | xargs -0 shellcheck -e SC1091 -S warning || echo "shellcheck reported findings (not blocking)"

# --- Reporting ---------------------------------------------------------

lint-ruff:
  extends: .python
  stage: report
  allow_failure: true
  before_script: []
  script:
    - pip install ruff
    - ruff check backend/app

bandit:
  extends: .python
  stage: report
  allow_failure: true
  before_script: []
  script:
    - pip install bandit
    - bandit -r backend/app -ll -q

semgrep:
  stage: report
  image: semgrep/semgrep:latest
  allow_failure: true
  script:
    - semgrep --config=auto --error backend/app
